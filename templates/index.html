<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
        <title>Odin's Kin</title>
        <link rel="icon" href="{{ url_for('static', filename='mark.svg') }}" type="image/svg+xml" />
        <link rel="preload" href="{{ url_for('static', filename='fonts/InterVariable.ttf') }}" as="font" type="font/ttf" crossorigin />
        <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}" />
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <a class="brand" href="#" aria-label="Odin's Kin, back to the report">
                    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
                        <defs>
                            <linearGradient id="mark-ig" x1="0" y1="1" x2="1" y2="0">
                                <stop offset="0" stop-color="#FEDA75" />
                                <stop offset=".25" stop-color="#FA7E1E" />
                                <stop offset=".5" stop-color="#D62976" />
                                <stop offset=".75" stop-color="#962FBF" />
                                <stop offset="1" stop-color="#4F5BD5" />
                            </linearGradient>
                        </defs>
                        <circle cx="16" cy="16" r="14.6" fill="none" stroke="url(#mark-ig)" stroke-width="2.8" />
                        <circle cx="16" cy="16" r="11.4" fill="#111114" />
                        <path d="M13.8 9.3v13.7M13.8 9.3l6 5.5M13.8 15.1l6 5.5" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" />
                    </svg>
                    <span>Odin's Kin</span>
                </a>
                <div class="segmented" role="group" aria-label="Report range">
                    <button type="button" data-view="day" aria-pressed="true">Day</button>
                    <button type="button" data-view="week" aria-pressed="false">Week</button>
                    <span class="segmented-thumb" aria-hidden="true"></span>
                </div>
            </div>
        </header>

        <main class="layout">
            <section class="report" aria-labelledby="range-title">
                <div class="title-row">
                    <h1 id="range-title">Today</h1>
                    <div class="stepper">
                        <button type="button" class="icon-button" id="prev" aria-label="Previous day">
                            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
                        </button>
                        <button type="button" class="icon-button" id="next" aria-label="Next day">
                            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" /></svg>
                        </button>
                    </div>
                </div>
                <div id="report" aria-live="polite"></div>
            </section>

            <section class="side" aria-label="Sessions">
                <div id="side"></div>
            </section>
        </main>

        <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

        <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
    </body>
</html>
